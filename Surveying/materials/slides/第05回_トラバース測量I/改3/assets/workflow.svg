<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>観測から座標までの流れ</title><desc>Xは北、Yは東。方向角Tおよび観測角βは時計回り。</desc><defs><marker id="a19354a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#19354a"/></marker><marker id="a287cb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#287cb5"/></marker><marker id="ad77c26" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d77c26"/></marker><marker id="a16866d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16866d"/></marker><marker id="a728491" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#728491"/></marker></defs><rect width="900" height="720" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#19354a" stroke-linecap="round" stroke-linejoin="round"><rect x="100" y="30" width="700" height="95" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="135" y="89" font-size="34" fill="#287cb5" text-anchor="middle" font-weight="500">1</text><text x="435" y="72" font-size="33" fill="#19354a" text-anchor="middle" font-weight="500">現場観測</text><text x="435" y="109" font-size="27" fill="#728491" text-anchor="middle" font-weight="500">距離 S・角 β</text><line x1="450.00" y1="130.00" x2="450.00" y2="150.00" stroke="#287cb5" stroke-width="4" marker-end="url(#a287cb5)"/><rect x="100" y="150" width="700" height="95" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="135" y="209" font-size="34" fill="#287cb5" text-anchor="middle" font-weight="500">2</text><text x="435" y="192" font-size="33" fill="#19354a" text-anchor="middle" font-weight="500">角の点検・調整</text><text x="435" y="229" font-size="27" fill="#728491" text-anchor="middle" font-weight="500">内角和 → εβ</text><line x1="450.00" y1="250.00" x2="450.00" y2="270.00" stroke="#287cb5" stroke-width="4" marker-end="url(#a287cb5)"/><rect x="100" y="270" width="700" height="95" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="135" y="329" font-size="34" fill="#287cb5" text-anchor="middle" font-weight="500">3</text><text x="435" y="312" font-size="33" fill="#19354a" text-anchor="middle" font-weight="500">方向角を伝える</text><text x="435" y="349" font-size="27" fill="#728491" text-anchor="middle" font-weight="500">後視 → 時計回り β</text><line x1="450.00" y1="370.00" x2="450.00" y2="390.00" stroke="#287cb5" stroke-width="4" marker-end="url(#a287cb5)"/><rect x="100" y="390" width="700" height="95" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="135" y="449" font-size="34" fill="#287cb5" text-anchor="middle" font-weight="500">4</text><text x="435" y="432" font-size="33" fill="#19354a" text-anchor="middle" font-weight="500">成分に分ける</text><text x="435" y="469" font-size="27" fill="#728491" text-anchor="middle" font-weight="500">ΔX・ΔY</text><line x1="450.00" y1="490.00" x2="450.00" y2="510.00" stroke="#287cb5" stroke-width="4" marker-end="url(#a287cb5)"/><rect x="100" y="510" width="700" height="95" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="135" y="569" font-size="34" fill="#287cb5" text-anchor="middle" font-weight="500">5</text><text x="435" y="552" font-size="33" fill="#19354a" text-anchor="middle" font-weight="500">座標を足す</text><text x="435" y="589" font-size="27" fill="#728491" text-anchor="middle" font-weight="500">X・Y</text><rect x="35" y="634" width="830" height="64" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="450" y="677" font-size="29" fill="#19354a" text-anchor="middle" font-weight="500">点検しながら、順序を守って進める</text></g></svg>