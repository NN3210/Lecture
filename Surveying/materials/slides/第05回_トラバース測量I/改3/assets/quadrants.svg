<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>象限と成分の符号</title><desc>Xは北、Yは東。方向角Tおよび観測角βは時計回り。</desc><defs><marker id="a19354a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#19354a"/></marker><marker id="a287cb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#287cb5"/></marker><marker id="ad77c26" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d77c26"/></marker><marker id="a16866d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16866d"/></marker><marker id="a728491" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#728491"/></marker></defs><rect width="900" height="720" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#19354a" stroke-linecap="round" stroke-linejoin="round"><line x1="450.00" y1="590.00" x2="450.00" y2="95.00" stroke="#19354a" stroke-width="4" marker-end="url(#a19354a)"/><line x1="100.00" y1="335.00" x2="795.00" y2="335.00" stroke="#19354a" stroke-width="4" marker-end="url(#a19354a)"/><text x="450" y="60" font-size="32" fill="#19354a" text-anchor="middle" font-weight="500">X 座標北：0°</text><text x="780" y="385" font-size="28" fill="#19354a" text-anchor="middle" font-weight="500">Y 東</text><text x="650" y="175" font-size="28" fill="#16866d" text-anchor="middle" font-weight="500">0° &lt; T &lt; 90°</text><text x="650" y="224" font-size="29" fill="#16866d" text-anchor="middle" font-weight="500">ΔX ＋　ΔY ＋</text><text x="650" y="470" font-size="28" fill="#287cb5" text-anchor="middle" font-weight="500">90° &lt; T &lt; 180°</text><text x="650" y="519" font-size="29" fill="#287cb5" text-anchor="middle" font-weight="500">ΔX −　ΔY ＋</text><text x="240" y="470" font-size="28" fill="#d77c26" text-anchor="middle" font-weight="500">180° &lt; T &lt; 270°</text><text x="240" y="519" font-size="29" fill="#d77c26" text-anchor="middle" font-weight="500">ΔX −　ΔY −</text><text x="240" y="175" font-size="28" fill="#16866d" text-anchor="middle" font-weight="500">270° &lt; T &lt; 360°</text><text x="240" y="224" font-size="29" fill="#16866d" text-anchor="middle" font-weight="500">ΔX ＋　ΔY −</text><rect x="35" y="634" width="830" height="64" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="450" y="677" font-size="29" fill="#19354a" text-anchor="middle" font-weight="500">X の符号は南北、Y の符号は東西</text></g></svg>