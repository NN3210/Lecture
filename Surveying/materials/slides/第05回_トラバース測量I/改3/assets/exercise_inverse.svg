<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img"><title>Pから北西にあるQへの逆計算</title><desc>Xは北、Yは東。方向角Tおよび観測角βは時計回り。</desc><defs><marker id="a19354a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#19354a"/></marker><marker id="a287cb5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#287cb5"/></marker><marker id="ad77c26" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d77c26"/></marker><marker id="a16866d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16866d"/></marker><marker id="a728491" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#728491"/></marker></defs><rect width="900" height="720" fill="white"/><g font-family="Noto Sans CJK JP, sans-serif" fill="#19354a" stroke-linecap="round" stroke-linejoin="round"><path d="M 710.00 520.00 L 710.00 264.00 L 230.00 264.00" stroke="#728491" stroke-width="4" fill="none" stroke-dasharray="10 10"/><line x1="710.00" y1="520.00" x2="230.00" y2="264.00" stroke="#287cb5" stroke-width="7" marker-end="url(#a287cb5)"/><circle cx="710.00" cy="520.00" r="9" fill="white" stroke="#19354a" stroke-width="5"/><text x="740" y="552" font-size="36" fill="#19354a" text-anchor="middle" font-weight="700">P</text><circle cx="230.00" cy="264.00" r="9" fill="white" stroke="#19354a" stroke-width="5"/><text x="200" y="249" font-size="36" fill="#19354a" text-anchor="middle" font-weight="700">Q</text><line x1="710.00" y1="520.00" x2="710.00" y2="125.00" stroke="#728491" stroke-width="3" marker-end="url(#a728491)"/><text x="710" y="85" font-size="30" fill="#19354a" text-anchor="middle" font-weight="500">座標北 X</text><text x="793" y="395" font-size="32" fill="#16866d" text-anchor="middle" font-weight="500">ΔX</text><text x="793" y="435" font-size="32" fill="#16866d" text-anchor="middle" font-weight="500">＋80</text><text x="455" y="225" font-size="34" fill="#d77c26" text-anchor="middle" font-weight="500">ΔY = −150</text><text x="235" y="135" font-size="31" fill="#19354a" text-anchor="middle" font-weight="500">Q (1580, 2150)</text><text x="620" y="595" font-size="31" fill="#19354a" text-anchor="middle" font-weight="500">P (1500, 2300)</text><rect x="35" y="634" width="830" height="64" rx="18" fill="#f2f6f8" stroke="none" stroke-width="2"/><text x="450" y="677" font-size="29" fill="#19354a" text-anchor="middle" font-weight="500">P→Q は北西：距離と方向角を求める</text></g></svg>